{% extends 'base.html' %}
{% block content %}
<h1>Dự án kiểm thử web</h1>
<section><h2>Tạo dự án</h2><form method="post">{% csrf_token %}{{ form.as_p }}<button>Tạo dự án</button></form></section>
<h2>Danh sách dự án</h2>
<ul>{% for project in projects %}<li><a href="{% url 'project_detail' project.pk %}">{{ project.name }}</a> — {{ project.target_url }}</li>{% empty %}<li>Chưa có dự án.</li>{% endfor %}</ul>
{% endblock %}
